<!doctype html><html><head><meta charset="utf-8"><title>Mixamo clip retarget check</title>
<style>body{margin:0;background:#1a1f1e;color:#8f8;font:12px ui-monospace,monospace}#out{padding:8px;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/examples/jsm/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><pre id="out">loading…</pre><script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
const log=[], out=document.getElementById('out');
const W=180,H=420, COLS=6;
const load = u => new FBXLoader().loadAsync(u);

const base = await load('/assets/anim/breathing-idle.fbx');
let skin=null; base.traverse(o=>{ if(o.isSkinnedMesh && !skin) skin=o; });
const idle = base.animations[0];
log.push(`base: skinnedMesh=${!!skin} bones=${skin?skin.skeleton.bones.length:0} idleClip="${idle?.name}" ${idle?.duration.toFixed(2)}s`);

// clips exported "Without Skin" — same rig, so their tracks should bind by bone name
const clips = {};
for (const [name, url] of [['walk','/assets/anim/walking.fbx'], ['run','/assets/anim/running.fbx']]) {
  const g = await load(url);
  const c = g.animations[0];
  clips[name] = c;
  let meshes=0; g.traverse(o=>{ if(o.isMesh) meshes++; });
  log.push(`${name}: clip="${c?.name}" ${c?.duration.toFixed(2)}s tracks=${c?.tracks.length} meshesInFile=${meshes}`);
  // do the track names match bones that exist on the base skeleton?
  const boneNames = new Set(skin.skeleton.bones.map(b=>b.name));
  const roots = new Set(c.tracks.map(t=>t.name.split('.')[0]));
  const matched = [...roots].filter(n=>boneNames.has(n));
  log.push(`     track targets ${roots.size}, matching base bones ${matched.length}  ${matched.length? 'BINDS' : 'DOES NOT BIND'}`);
  const miss=[...roots].filter(n=>!boneNames.has(n)).slice(0,4);
  if(miss.length) log.push(`     unmatched examples: ${miss.join(', ')}`);
}

// render: idle / walk / run, 2 frames each, on the SAME skinned mesh
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.setPixelRatio(1);
r.outputColorSpace=THREE.SRGBColorSpace;
const strip=document.createElement('canvas'); strip.width=W*COLS; strip.height=H;
document.body.appendChild(strip); const ctx=strip.getContext('2d');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x232c2a);
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2.6));
const dl=new THREE.DirectionalLight(0xffffff,2.2); dl.position.set(4,7,5); scene.add(dl);
scene.add(base);
const bb=new THREE.Box3().setFromObject(base), sz=new THREE.Vector3(); bb.getSize(sz);
const c0=bb.getCenter(new THREE.Vector3());
const cam=new THREE.PerspectiveCamera(30,W/H,0.01,100);
cam.position.set(c0.x+sz.y*1.3, c0.y, c0.z+sz.y*1.0); cam.lookAt(c0.x,c0.y,c0.z);
scene.add(new THREE.GridHelper(sz.y*4, 12, 0x446655, 0x334444));
const mixer=new THREE.AnimationMixer(base);
const shots=[];
let col=0;
for (const [label, clip] of [['idle',idle],['walk',clips.walk],['run',clips.run]]) {
  if(!clip){ col+=2; continue; }
  const act=mixer.clipAction(clip); mixer.stopAllAction(); act.reset().play();
  for (const f of [0.25, 0.6]) {
    mixer.setTime(0); mixer.update(clip.duration*f);
    r.render(scene,cam); ctx.drawImage(r.domElement, col*W, 0);
    ctx.fillStyle='#9fe'; ctx.font='12px monospace'; ctx.fillText(`${label} ${f}`, col*W+6, 16);
    const gl=r.getContext(); const buf=new Uint8Array(W*H*4);
    gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,buf); shots.push({label,buf});
    col++;
  }
}
const diff=(a,b)=>{let n=0;for(let i=0;i<a.length;i+=4){if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])>12)n++;}return n;};
if(shots.length>=6){
  log.push('', `idle vs walk: ${diff(shots[0].buf, shots[2].buf)} px differ`);
  log.push(`idle vs run : ${diff(shots[0].buf, shots[4].buf)} px differ`);
  log.push(`walk vs run : ${diff(shots[2].buf, shots[4].buf)} px differ`);
  log.push('(all three must differ substantially, or the clips are not driving the mesh)');
}
out.textContent=log.join('\n'); window.__ANIM__=log.join('\n');
</script></body></html>
